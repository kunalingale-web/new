<!DOCTYPE html>
<html>
<head>
    <title>Indian Tadka - Table Booking</title>
</head>
<body>

    <header>
        <link rel="stylesheet" href="base.css">
        <h1 style="font-size: 102px;">🍛 INDIAN TADKA</h1>
        <p style="font-size: 50px;">Authentic Indian Taste</p>
    </header>

    <center>

    <nav style="font-size: 30px;">
        |<a href="index.html">Home</a> | <br><br>
        |<a href="about.html">About</a> | <br><br>
        |<a href="menu.html">Menu</a> | <br><br>
        |<a href="booking.html">Table Booking</a> | <br><br>
        |<a href="contact.html">Contact</a> | <br><br>
    </nav>
    </center>

    <hr>

    <main>
        <h2 style="font-size: 60px;">Table Booking</h2>

        <form style="font-size: 30px;">

            <label>Full Name:</label>
            <input type="text" name="name" style="font-size: 20px;">
            <br><br>

            <label>Mobile Number:</label>
            <input type="tel" name="mobile" style="font-size: 20px;">
            <br><br>

            <label>Email:</label>
            <input type="email" name="email" style="font-size: 20px;">
            <br><br>

            <label>Booking Date:</label>
            <input type="date" name="date" style="font-size: 30px;">
            <br><br>

            <label>Booking Time:</label>
            <input type="time" name="time" style="font-size: 20px;">
            <br><br>

            <label>Number of Guests:</label>
            <select name="guests" style="font-size: 20px;">
                <option>1 Person</option>
                <option>2 Persons</option>
                <option>3 Persons</option>
                <option>4 Persons</option>
                <option>5 Persons</option>
                <option>6 Persons</option>
                <option>7 Persons</option>
                <option>8 Persons</option>
                <option>More than 8</option>
            </select>

            <br><br>

            <label>Special Request:</label>
            <br>
            <textarea name="request" rows="5" cols="30" style="font-size: 20px;"></textarea>

            <br><br>

            <input type="submit" value="Book Table" style="font-size: 30px;">
            <input type="reset" value="Reset" style="font-size: 30px;">

        </form>
    </main>

    <hr>

    <footer>
        <p style="font-size: 20px;">© 2026 Indian Tadka. All Rights Reserved.</p>
    </footer>

</body>
</html>
